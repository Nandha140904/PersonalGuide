# Personal Guide iOS Project
# Generated by xcodegen — run `xcodegen generate` to create PersonalGuide.xcodeproj

name: PersonalGuide

options:
  bundleIdPrefix: com.personalguide
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  PersonalGuide:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: PersonalGuide
        excludes:
          - "**/.DS_Store"
          - "Info.plist"

    info:
      path: PersonalGuide/Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalguide.app
        SWIFT_EMIT_LOC_STRINGS: true
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    entitlements:
      path: PersonalGuide/PersonalGuide.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: []
        com.apple.developer.icloud-services: []

  PersonalGuideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: PersonalGuideTests

    dependencies:
      - target: PersonalGuide

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalguide.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PersonalGuide.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PersonalGuide"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
