name: Build & Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

env:
  SCHEME: PersonalGuide

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: macos-15  # macOS Sequoia

    steps:
      # ── Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Show Developer Environment ────────────────────
      - name: Show Xcode & SDK version
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes

      # ── Generate Xcode Project ────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate .xcodeproj
        run: xcodegen generate
        env:
          DEVELOPMENT_TEAM: ""

      # ── Build for iOS Device (ARM64) ──────────────────
      - name: Build iOS App
        run: |
          xcodebuild build \
            -project PersonalGuide.xcodeproj \
            -scheme $SCHEME \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  deploy-testflight:
    name: Archive & Deploy to TestFlight
    needs: build-and-test
    runs-on: macos-15

    steps:
      # ── Check if signing secrets exist ────────────────
      - name: Check signing configuration
        id: check_secrets
        env:
          BUILD_CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$BUILD_CERTIFICATE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::Signing secrets are not configured in repository secrets. Skipping TestFlight deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Install XcodeGen
        if: steps.check_secrets.outputs.configured == 'true'
        run: brew install xcodegen

      - name: Generate .xcodeproj
        if: steps.check_secrets.outputs.configured == 'true'
        run: xcodegen generate
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

      # ── Install Signing Certificate ───────────────────
      - name: Install Apple certificate
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # ── Install Provisioning Profile ──────────────────
      - name: Install provisioning profile
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── Archive ───────────────────────────────────────
      - name: Archive for distribution
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          xcodebuild archive \
            -project PersonalGuide.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PersonalGuide.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }} \
            CODE_SIGN_IDENTITY="Apple Distribution"

      # ── Export IPA ────────────────────────────────────
      - name: Create ExportOptions.plist
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.DEVELOPMENT_TEAM }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PersonalGuide.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      # ── Upload to TestFlight ──────────────────────────
      - name: Upload to TestFlight
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/PersonalGuide.ipa \
            -t ios \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID

      # ── Cleanup ───────────────────────────────────────
      - name: Clean up keychain and profiles
        if: always() && steps.check_secrets.outputs.configured == 'true'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/build_pp.mobileprovision
          rm -rf ~/private_keys
