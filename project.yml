# Personal Guide iOS Project
# Generated by xcodegen — run `xcodegen generate` to create PersonalGuide.xcodeproj
# This replaces the need to manually create an Xcode project.

name: PersonalGuide

options:
  bundleIdPrefix: com.personalguide
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: "Personal Guide"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"

targets:
  PersonalGuide:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: PersonalGuide
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalguide.app
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

    entitlements:
      path: PersonalGuide/PersonalGuide.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: []
        com.apple.developer.icloud-services: []

  PersonalGuideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: PersonalGuideTests

    dependencies:
      - target: PersonalGuide

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalguide.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PersonalGuide.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PersonalGuide"
        BUNDLE_LOADER: "$(TEST_HOST)"
